# TLS ortak ayarları — sertifika yolu tls-issue.sh tarafından güncellenir.
ssl_certificate     /etc/veritut/tls/fullchain.pem;
ssl_certificate_key /etc/veritut/tls/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:VERITUT:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
