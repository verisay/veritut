# VERITUT prod — nginx (plan §1.2 alan adı haritası, tek makine konsolidasyonu)
# Zincir: internet:443 → nginx → 127.0.0.1:<port>. Uygulamaların hiçbiri dışarı bağlanmaz.
# Sertifika: bootstrap self-signed üretir; DNS geldiğinde `infra/prod/tls-issue.sh` Let's Encrypt'e çevirir.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Proxy'nin uygulamalara söylediği ortak başlıklar (SvelteKit adapter-node ORIGIN doğrulaması dâhil).
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  443;

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  # ACME webroot (certbot) — gerisi https'e gider.
  location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://$host$request_uri; }
}

# --- veritut.com — pazarlama + müşteri portalı (same-origin /api/v1) ---
server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  http2 on;
  server_name veritut.com www.veritut.com;
  include /etc/nginx/snippets/veritut-tls.conf;
  include /etc/nginx/snippets/veritut-acme.conf;
  include /etc/nginx/snippets/veritut-guvenlik.conf;

  client_max_body_size 25m;

  location /api/v1 {
    proxy_pass http://127.0.0.1:4400;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
  }
  location / {
    proxy_pass http://127.0.0.1:5240;
  }
}

# --- ops.veritut.com — operasyon paneli (canlı run logu WS) ---
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name ops.veritut.com;
  include /etc/nginx/snippets/veritut-tls.conf;
  include /etc/nginx/snippets/veritut-acme.conf;
  include /etc/nginx/snippets/veritut-guvenlik.conf;

  client_max_body_size 25m;

  # Personel yüzeyi — IP allow-list buraya (plan §1.2). Şimdilik açık; kısıtlama
  # `allow <ip>; deny all;` satırlarıyla açılır, ops realm MFA ile birlikte (B8).
  location /api/v1 {
    proxy_pass http://127.0.0.1:4400;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;   # /api/v1/ws/runs/<id> canlı log
  }
  location / {
    proxy_pass http://127.0.0.1:5241;
  }
}

# --- durum.veritut.com — status app (stateless; ana yığın düşse ayakta kalmalı) ---
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name durum.veritut.com;
  include /etc/nginx/snippets/veritut-tls.conf;
  include /etc/nginx/snippets/veritut-acme.conf;
  include /etc/nginx/snippets/veritut-guvenlik.conf;
  location / { proxy_pass http://127.0.0.1:5242; }
}

# --- kimlik.veritut.com — Keycloak ---
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name kimlik.veritut.com;
  include /etc/nginx/snippets/veritut-tls.conf;
  include /etc/nginx/snippets/veritut-acme.conf;
  include /etc/nginx/snippets/veritut-guvenlik.conf;

  # Yönetim konsolu yalnız localhost/VPN'den; şimdilik açık, B8 ile kısıtlanır.
  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
  }
}

# --- api.veritut.com — public API (/api/v1/ext, Bearer vt_…) ---
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name api.veritut.com;
  include /etc/nginx/snippets/veritut-tls.conf;
  include /etc/nginx/snippets/veritut-acme.conf;
  include /etc/nginx/snippets/veritut-guvenlik.conf;
  client_max_body_size 25m;
  location / {
    proxy_pass http://127.0.0.1:4400;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
  }
}

# --- s3.veritut.com — MinIO (iş yükü VM'lerindeki restic buraya yazar) ---
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name s3.veritut.com;
  include /etc/nginx/snippets/veritut-tls.conf;
  include /etc/nginx/snippets/veritut-acme.conf;
  client_max_body_size 0;        # restic parçaları
  location / {
    proxy_pass http://127.0.0.1:9000;
    proxy_request_buffering off;
    proxy_read_timeout 900s;
  }
}
