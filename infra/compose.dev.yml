# VERITUT — dev stack. Filo deseni: klasman / kaydadeger ile aynı kalıp.
# Çalıştırma: cd /srv/fleet/projects/veritut && docker compose -f infra/compose.dev.yml up -d
# Gözlem profili (Prometheus/Alertmanager/Grafana): --profile observability (K2+)
#
# Zincir: nginx(443, dev-fethi-fleet cert) → 127.0.0.1:8090 → Traefik → container
# Yeni host = sertifika SAN genişletme:
#   bash /srv/fleet/infra/dev-fethi-fleet-cert-add.sh vt-portal vt-ops vt-status vt-api vt-kimlik vt-s3
#
# DNS: traefik ağı filo geneli PAYLAŞIMLI — `api`, `portal` gibi çıplak servis adları başka projenin
# container'ına çözülebilir (ölçüldü: ops → carrentall api). İç URL'ler proje-özel alias kullanır:
# veritut-api, veritut-keycloak, … (yalnız `proj` ağında tanımlı → tekil).
#
# Güven sınırları (D5): runner AYRI imaj, tedarikçi sırlarını açan tek süreç; API/worker'da özel anahtar yok.

name: ${PROJECT}

x-app: &app
  image: ${PROJECT}-app
  build:
    context: ..
    dockerfile: infra/Dockerfile
  env_file: [.env]
  volumes:
    - ..:/app
    - node_modules:/app/node_modules
    - pnpm-store:/pnpm
  working_dir: /app
  networks: [proj, traefik]
  restart: unless-stopped

services:
  api:
    <<: *app
    command: sh -c "pnpm --filter @${PROJECT}/api dev"
    environment:
      # API özel anahtarı GÖRMEZ — env_file'daki değeri boşa ez (D12).
      RUNNER_PRIVATE_KEY: ''
      BLUEPRINTS_DIR: /app/infra/blueprints
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      keycloak: { condition: service_started }
    labels:
      - traefik.enable=true
      - traefik.http.routers.${SLUG}-api.rule=Host(`${SLUG}-api.dev-fethi.entra.net`)
      - traefik.http.services.${SLUG}-api.loadbalancer.server.port=4400
      # Same-origin /api/v1 — her yüzey kendi host'undan API'ye konuşur (çerez/CORS sade).
      - traefik.http.routers.${SLUG}-api-portal.rule=Host(`${SLUG}-portal.dev-fethi.entra.net`) && PathPrefix(`/api/v1`)
      - traefik.http.routers.${SLUG}-api-portal.service=${SLUG}-api
      - traefik.http.routers.${SLUG}-api-ops.rule=Host(`${SLUG}-ops.dev-fethi.entra.net`) && PathPrefix(`/api/v1`)
      - traefik.http.routers.${SLUG}-api-ops.service=${SLUG}-api
    networks:
      proj: { aliases: [veritut-api] }
      traefik: {}

  worker:
    <<: *app
    command: sh -c "pnpm --filter @${PROJECT}/worker dev"
    environment:
      RUNNER_PRIVATE_KEY: ''
    depends_on:
      redis: { condition: service_healthy }
      api: { condition: service_started }

  runner:
    <<: *app
    image: ${PROJECT}-runner
    build:
      context: ..
      dockerfile: infra/Dockerfile.runner
      args:
        INSTALL_IAC: ${RUNNER_INSTALL_IAC:-1}
    command: sh -c "pnpm --filter @${PROJECT}/runner dev"
    environment:
      # D11: OpenTofu state ayrı DB + ayrı rol, yalnız runner bilir; istemci tarafı şifreleme açık.
      TFSTATE_DATABASE_URL: postgres://tfstate:${TFSTATE_DB_PASSWORD}@postgres:5432/veritut_tfstate?sslmode=disable
      TFSTATE_ENC_PASSPHRASE: ${TFSTATE_ENC_PASSPHRASE}
      WORK_DIR: /var/lib/veritut/work
      BLUEPRINTS_DIR: /app/infra/blueprints
      PROVIDER_DRIVERS: ${PROVIDER_DRIVERS:-mock,hetzner}
      # Keycloak OIDC istemci provizyonu (uygulama blueprint'leri) — dev: bootstrap admin; prod: servis hesabı.
      KC_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      VT_KC_PUBLIC_URL: ${KC_PUBLIC_URL}
      VT_REPORT_URL: ${API_URL}
      VT_REPORT_TOKEN: ${INTERNAL_TOKEN}
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
      - pnpm-store:/pnpm
      - runner-work:/var/lib/veritut/work
    networks: [proj] # Traefik ağında DEĞİL — gelen HTTP yüzeyi yok
    depends_on:
      redis: { condition: service_healthy }
      api: { condition: service_started }

  portal:
    <<: *app
    command: sh -c "pnpm --filter @${PROJECT}/portal dev --host 0.0.0.0"
    environment:
      RUNNER_PRIVATE_KEY: ''
    depends_on: [api]
    labels:
      - traefik.enable=true
      - traefik.http.routers.${SLUG}-portal.rule=Host(`${SLUG}-portal.dev-fethi.entra.net`)
      - traefik.http.services.${SLUG}-portal.loadbalancer.server.port=5240
    networks:
      proj: { aliases: [veritut-portal] }
      traefik: {}

  ops:
    <<: *app
    command: sh -c "pnpm --filter @${PROJECT}/ops dev --host 0.0.0.0"
    environment:
      RUNNER_PRIVATE_KEY: ''
    depends_on: [api]
    labels:
      - traefik.enable=true
      - traefik.http.routers.${SLUG}-ops.rule=Host(`${SLUG}-ops.dev-fethi.entra.net`)
      - traefik.http.services.${SLUG}-ops.loadbalancer.server.port=5241
    networks:
      proj: { aliases: [veritut-ops] }
      traefik: {}

  status:
    <<: *app
    command: sh -c "pnpm --filter @${PROJECT}/status dev --host 0.0.0.0"
    environment:
      # D14: status yalnız Redis snapshot okur — DB/Keycloak/iç token yok.
      RUNNER_PRIVATE_KEY: ''
      DATABASE_URL: ''
      INTERNAL_TOKEN: ''
      SESSION_ENC_KEY: ''
    depends_on:
      redis: { condition: service_healthy }
    labels:
      - traefik.enable=true
      - traefik.http.routers.${SLUG}-status.rule=Host(`${SLUG}-status.dev-fethi.entra.net`)
      - traefik.http.services.${SLUG}-status.loadbalancer.server.port=5242
    networks:
      proj: { aliases: [veritut-status] }
      traefik: {}

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      TFSTATE_DB_PASSWORD: ${TFSTATE_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    networks: [proj]
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7
    command: redis-server --appendonly yes --aclfile /etc/redis/users.acl
    volumes:
      - redisdata:/data
      # ACL dosyası yorum satırı kabul etmez — açıklama burada: `status` kullanıcısı yalnız status:* okur (D14).
      - ./redis/users.acl:/etc/redis/users.acl:ro
    networks: [proj]
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: ${KC_PUBLIC_URL}
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      proj: { aliases: [veritut-keycloak] }
      traefik: {}
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.${SLUG}-kimlik.rule=Host(`${SLUG}-kimlik.dev-fethi.entra.net`)
      - traefik.http.services.${SLUG}-kimlik.loadbalancer.server.port=8080

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: [miniodata:/data]
    networks:
      proj: { aliases: [veritut-minio] }
      traefik: {}
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.${SLUG}-s3.rule=Host(`${SLUG}-s3.dev-fethi.entra.net`)
      - traefik.http.services.${SLUG}-s3.loadbalancer.server.port=9000

  # ── Gözlem profili (D16) — K2'de hedef üretimi bağlanır ──────────────────
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    volumes: [promdata:/prometheus]
    networks: [proj]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.3.0
    profiles: [observability]
    environment:
      GF_SERVER_ROOT_URL: https://${SLUG}-grafana.dev-fethi.entra.net
    volumes: [grafanadata:/var/lib/grafana]
    networks: [proj, traefik]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.${SLUG}-grafana.rule=Host(`${SLUG}-grafana.dev-fethi.entra.net`)
      - traefik.http.services.${SLUG}-grafana.loadbalancer.server.port=3000

volumes:
  runner-work:
  pgdata:
  redisdata:
  miniodata:
  promdata:
  grafanadata:
  node_modules:
  pnpm-store:
    external: true

networks:
  proj:
  traefik:
    external: true
