- name: uygulama dizini
  file: { path: "{{ app_dir }}", state: directory, mode: "0750" }
- name: compose dosyası
  copy: { dest: "{{ app_dir }}/compose.yml", content: "{{ app_compose }}" }
- name: .env
  copy:
    dest: "{{ app_dir }}/.env"
    mode: "0600"
    content: "{% for k, v in app_env.items() %}{{ k }}={{ v }}\n{% endfor %}"
  no_log: true
- name: compose up
  community.docker.docker_compose_v2: { project_src: "{{ app_dir }}", state: present, pull: policy }
