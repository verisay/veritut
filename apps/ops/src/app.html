<!doctype html>
<html lang="tr" data-default-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/veritut-logo.png" />
    <script>
      // FOUC'suz tema — kaynak: packages/ui/src/lib/theme-init.js
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var def = document.documentElement.getAttribute('data-default-theme');
          var dark = t === 'dark' || (!t && (def === 'dark' || matchMedia('(prefers-color-scheme: dark)').matches));
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display:contents">%sveltekit.body%</div>
  </body>
</html>
