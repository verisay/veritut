name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: veritut, POSTGRES_PASSWORD: veritut, POSTGRES_DB: veritut }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U veritut" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://veritut:veritut@localhost:5432/veritut
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm db:migrate
      # K1+: API'yi Keycloak servisiyle kaldırıp smoke paketleri (kiracı izolasyon + fail-closed) buraya eklenir.
